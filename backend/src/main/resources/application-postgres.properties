# PostgreSQL profile for persistent production DB (Neon, Supabase, etc.)
# Activate: SPRING_PROFILES_ACTIVE=postgres
# Datasource configured via SPRING_DATASOURCE_* env vars set on Render:
#   SPRING_DATASOURCE_URL        = jdbc:postgresql://ep-xxx/neondb?sslmode=require
#   SPRING_DATASOURCE_USERNAME  = neondb_owner
#   SPRING_DATASOURCE_PASSWORD  = <password>
#   SPRING_DATASOURCE_DRIVER_CLASS_NAME = org.postgresql.Driver
# Spring Boot 3.x auto-binds SPRING_DATASOURCE_* → spring.datasource.*

# HikariCP tuned for serverless Postgres (Neon scale-to-zero)
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.validation-timeout=5000

# JPA — auto-update schema (safe; idempotent across restarts)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:false}
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.open-in-view=false

# Disable email (no SMTP configured)
spring.mail.host=localhost
spring.mail.port=25
app.email.enabled=false

# Enable DataSeeder on first boot (skips itself if data already exists)
app.data.seeder.enabled=true

# Logging
logging.level.com.hospital.scheduler=INFO
logging.level.org.hibernate.SQL=WARN

# Actuator
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=health,info,metrics

# SpringDoc
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Server (Render sets PORT automatically)
server.port=${SERVER_PORT:8080}

# JWT (must be set via env var in production)
jwt.secret=${JWT_SECRET:dGVzdHNlY3JldGtleWZvcihkZXYpYW5kdW5pdHRlc3RzdGVzdHNlY3JldGtleWZvcihkZXYpYW5kdW5pdHRlc3RzdGVzdHNlY3JldA==}
jwt.expiration=${JWT_EXPIRATION:2592000000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

spring.security.enabled=true

# CORS — allow deployed frontend (overridden via env var if needed)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://scheduling-management-system-frontend.onrender.com,http://localhost:3000,http://localhost:3001}
