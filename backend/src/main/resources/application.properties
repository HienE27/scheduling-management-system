# Spring Boot
spring.application.name=hospital-scheduler

# Database - uses environment variables with defaults for local dev
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:hospital_scheduler}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool - timeouts tuned for long-running auto-scheduling operations
spring.datasource.hikari.connection-timeout=120000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20

# JPA
#spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:false}
# REPEATABLE_READ (4) — required by Project Context to avoid dirty-read
# race conditions when multiple managers run auto-scheduling concurrently.
# Lower values (0-3) may cause the scheduler to read uncommitted data.
spring.jpa.properties.hibernate.connection.isolation=4
spring.jpa.open-in-view=false

# Server
server.port=${SERVER_PORT:8080}
# Force JVM + Jackson timezone to Asia/Ho_Chi_Minh so date comparisons are
# deterministic regardless of the host OS locale or clock offset.
spring.jackson.time-zone=Asia/Ho_Chi_Minh
user.timezone=Asia/Ho_Chi_Minh

# JWT - dev default only. MUST be overridden via JWT_SECRET env var in production.
# The dev fallback is an obviously-non-secret placeholder; production deploys
# (Render, Docker) fail-fast if JWT_SECRET is missing — see SecurityValidator.
jwt.secret=${JWT_SECRET:dev-only-do-not-use-in-production}
# Access token: 30 days dev (2,592,000,000 ms). Long enough that you can
# leave the app open for a week of dev without being kicked out, but
# still bounded so a leaked token eventually expires. Pair with a
# long-lived refresh token (7 days) and refresh-on-use rotation.
#
# WARNING: Production MUST override JWT_EXPIRATION via env var (recommended:
# 900000 ms = 15 minutes for prod, with a refresh-token rotation flow).
jwt.expiration=${JWT_EXPIRATION:2592000000}
# Refresh token: 7 days (604,800,000 ms). Rotated on every successful /auth/refresh.
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# App auth cookie
app.auth.cookie-secure=${COOKIE_SECURE:false}
app.auth.cookie-same-site=Lax

# SpringDoc OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true

# File Upload Limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.com.hospital.scheduler=${LOG_LEVEL:INFO}
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:WARN}

# Global exception handler:
# - throw-exception-if-no-handler-found: lets GlobalExceptionHandler catch
#   unknown URLs (returns 404) instead of falling back to static resource
#   handling (which surfaces as a 500 "No static resource ..." error).
# - add-mappings=false: disables the default static-resource mapping entirely.
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# Hibernate Batch Configuration
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Actuator - always show health details so /actuator/health surfaces which
# component (db, disk, etc.) is DOWN instead of an empty 503 body.
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.endpoints.web.exposure.include=health,info,metrics,prometheus,caches
management.endpoint.health.roles=SUPERUSER
management.endpoint.metrics.enabled=true
management.endpoint.caches.enabled=true
management.metrics.enable.jvm=true
management.metrics.enable.http=true
management.metrics.enable.datasource=true
management.metrics.enable.cache=true
management.health.db.enabled=true
# Disable mail health indicator — app.email.enabled defaults to false in
# local dev, so the SMTP probe is a false-negative that drags overall
# status to DOWN. Mail is exercised only when the feature is on.
management.health.mail.enabled=false

# Thymeleaf email templates
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

# Email Configuration - defaults intentionally removed.
# Set APP_EMAIL_ENABLED=true and override mail host/credentials via environment
# variables in production. Do NOT commit credentials to source control.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED:true}

# App email settings
app.email.enabled=${APP_EMAIL_ENABLED:false}
app.email.from=${APP_EMAIL_FROM:noreply@hospital-scheduler.com}
app.email.conflict-notification.enabled=${APP_EMAIL_CONFLICT_ENABLED:false}

# Pagination limits
app.pagination.default-page-size=20
app.pagination.max-page-size=100
app.pagination.max-page-number=1000

# CORS allowed origins — comma-separated.
# Local dev defaults are baked into CorsProperties; production MUST override.
# Origin patterns cover *.vercel.app and *.onrender.com automatically so
# preview deployments work without touching this list.
# Example for staging:
#   app.cors.allowed-origins=https://medschedule-staging.example.com,https://admin-staging.example.com
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:5173}
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:https://*.vercel.app,https://*.onrender.com}

# Rate limiting (login attempts)
# Set app.auth.rate-limit.enabled=false in dev to avoid blocking testing
app.auth.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.auth.rate-limit.max-attempts=5
app.auth.rate-limit.window-minutes=15

# Scheduling v10 Configuration
# (V23: scheduling.search.* removed — duplicates of DB-driven scheduling_*
# keys. Source of truth is algorithm_config table.)

# Scheduling v11 — strategy swap (no code change required to switch)
# Valid kinds: HILL_CLIMBING, TABU, LATE_ACCEPTANCE, SIMULATED_ANNEALING, GREAT_DELUGE, VARIABLE_NEIGHBORHOOD_SEARCH
scheduling.strategy=TABU
scheduling.strategy.tabu-tenure-min=5
scheduling.strategy.tabu-tenure-max=15
scheduling.strategy.la-memory=400
scheduling.strategy.sa-t0=1000
scheduling.strategy.sa-cooling=0.99
scheduling.strategy.sa-tmin=1.0
scheduling.strategy.gd-decay=0.999
scheduling.strategy.gd-min-level=0.0
scheduling.strategy.vns-neighborhoods=HILL_CLIMBING,TABU

# (V24: parallelism / adaptive / auto-tune / ml-warm-start removed -
#  classes ParallelSearchEngine, AdaptiveController, AutoTuner,
#  MlWarmStart exist but are NEVER instantiated by the runtime.
#  See docs/migrations/V24_AUDIT.md.)

# Fairness targets
scheduling.fairness.cv-target=0.10
scheduling.fairness.cv-worst=0.50
scheduling.fairness.coverage-weight=0.40
scheduling.fairness.fairness-weight=0.35
scheduling.fairness.constraint-weight=0.25

# Termination criteria
scheduling.termination.relative-improvement-threshold=0.001
scheduling.termination.diversify-after=20
scheduling.termination.min-iterations-before-target=10
scheduling.termination.min-iterations-before-relative-improvement=20

