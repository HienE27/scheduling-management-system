# MySQL profile for runtime verification
spring.datasource.url=jdbc:mysql://localhost:3306/hospital_scheduler?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=123456

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.open-in-view=false

# Server
server.port=8080

# Disable email
spring.mail.host=localhost
spring.mail.port=25
app.email.enabled=false

# Disable DataSeeder (use H2 default ddl-auto instead)
app.data.seeder.enabled=false

# Reduce Hibernate log
logging.level.com.hospital.scheduler=DEBUG
logging.level.org.hibernate.SQL=WARN

# Actuator
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=health,info,metrics

# SpringDoc
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# JWT — dev/test profile. Override via JWT_SECRET env var in any non-test environment.
# Local profile intentionally uses a recognizable placeholder so accidental
# production use is obvious. Real secrets must NEVER be committed to git.
jwt.secret=${JWT_SECRET:local-dev-placeholder-do-not-use-in-production}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Disable security for H2 testing
spring.security.enabled=true

# CORS
app.cors.allowed-origins=http://localhost:3000,http://localhost:3001
