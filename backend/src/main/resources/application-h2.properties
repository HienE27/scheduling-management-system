# H2 in-memory profile for local dev (no MySQL needed)
spring.datasource.url=jdbc:h2:mem:dev;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.auto_quote_keyword=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Server
server.port=8081

# Disable email
spring.mail.host=localhost
spring.mail.port=25
app.email.enabled=false

# Disable DataSeeder
app.data.seeder.enabled=false

# Logging
logging.level.com.hospital.scheduler=INFO
logging.level.org.hibernate.SQL=WARN

# Actuator
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=health,info,metrics

# SpringDoc
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# JWT — in-memory H2 profile. Dev/test only.
# Real secrets must NEVER be committed to git.
jwt.secret=${JWT_SECRET:local-dev-placeholder-do-not-use-in-production}
jwt.expiration=2592000000
jwt.refresh-expiration=604800000

spring.security.enabled=true

# CORS
app.cors.allowed-origins=http://localhost:3000,http://localhost:3001
