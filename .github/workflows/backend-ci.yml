name: Backend CI/CD

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'backend/**'
      - 'pom.xml'
      - 'application.properties'
      - 'src/main/resources/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'backend/**'
      - 'pom.xml'
      - 'application.properties'
      - 'src/main/resources/**'
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  REGISTRY: ghcr.io
  IMAGE_NAME: hiene27/hospital-scheduler-backend

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Check for Maven wrapper
        id: mvnw-check
        run: |
          if [ -f "backend/mvnw" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Make Maven wrapper executable
        if: steps.mvnw-check.outputs.exists == 'true'
        run: chmod +x backend/mvnw

      - name: Build with Maven
        run: |
          if [ -f "backend/mvnw" ]; then
            ./backend/mvnw package -DskipTests -f backend/pom.xml
          else
            mvn package -DskipTests -f backend/pom.xml
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 5

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 3306:3306

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Check for Maven wrapper
        id: mvnw-check
        run: |
          if [ -f "backend/mvnw" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Make Maven wrapper executable
        if: steps.mvnw-check.outputs.exists == 'true'
        run: chmod +x backend/mvnw

      - name: Run tests
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/test_db
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
        run: |
          if [ -f "backend/mvnw" ]; then
            ./backend/mvnw test -f backend/pom.xml \
              -Dtest='!CspSchedulerSmokeTest,!SchedulingFitnessShiftWeightTest'
          else
            mvn test -f backend/pom.xml \
              -Dtest='!CspSchedulerSmokeTest,!SchedulingFitnessShiftWeightTest'
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/target/surefire-reports
          retention-days: 7

  docker-build:
    name: Docker Build & Push
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend/target

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract JAR filename
        id: jar-info
        run: |
          JAR_FILE=$(ls backend/target/*.jar | head -1)
          echo "file=${JAR_FILE}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Echo deploy info
        run: |
          echo "Docker image built and pushed successfully!"
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo ""
          echo "Deploy step is commented out - no server configured."
          echo "To enable deployment, configure SSH credentials in repository secrets"
          echo "and uncomment the deploy steps below."
          echo ""
          echo "# SSH_DEPLOY_HOST=\${{ secrets.SSH_DEPLOY_HOST }}"
          echo "# SSH_DEPLOY_USER=\${{ secrets.SSH_DEPLOY_USER }}"
          echo "# SSH_DEPLOY_KEY=\${{ secrets.SSH_DEPLOY_KEY }}"
          echo ""
          echo "# Deploy commands would be:"
          echo "# docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "# docker stop hospital-scheduler-backend || true"
          echo "# docker run -d --name hospital-scheduler-backend \\"
          echo "#   --restart unless-stopped \\"
          echo "#   -p 8080:8080 \\"
          echo "#   ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"

      # Uncomment the following steps when server is configured:
      # - name: Deploy to server via SSH
      #   uses: appleboy/ssh-action@v1
      #   with:
      #     host: ${{ secrets.SSH_DEPLOY_HOST }}
      #     username: ${{ secrets.SSH_DEPLOY_USER }}
      #     key: ${{ secrets.SSH_DEPLOY_KEY }}
      #     script: |
      #       docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
      #       docker stop hospital-scheduler-backend || true
      #       docker rm hospital-scheduler-backend || true
      #       docker run -d \
